name: Deploy frontend to GitHub Pages

# Builds the Vite frontend from source and publishes it at the site ROOT,
# so https://<user>.github.io/<repo>/ works (no nested folder).
#
# Set the repository variable VITE_API_BASE_URL (Settings > Secrets and
# variables > Actions > Variables) to your deployed FastAPI URL, e.g.
#   https://neerkaval-api.onrender.com
# Without it the app builds fine but shows an explicit
# "backend not connected" notice instead of pretending to have data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
