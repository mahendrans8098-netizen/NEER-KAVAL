version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=LIVE
      - DATABASE_URL=sqlite:///./neerkaval.db
      - JWT_SECRET=change-this-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - OPENMETEO_BASE_URL=https://api.open-meteo.com/v1/forecast
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - db-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
